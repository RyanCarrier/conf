# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Shared across hosts: brightnessctl no-ops without a backlight, and the
# suspend listener only fires when an AC adapter exists and is unplugged.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 2.5min: dim screen + kill keyboard backlight
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# 5min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15min: suspend, battery only
listener {
    timeout = 900
    on-timeout = grep -qx 0 /sys/class/power_supply/A*/online && systemctl suspend
}
